services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-photo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: photo
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photo}
    volumes:
      - ${DATA_DIR:-/volume1/docker/ai-photo-lib}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 10s
      timeout: 5s
      retries: 10

  llama:
    image: ai-photo-lib-llama:ds916-cpu
    container_name: ai-photo-llama
    restart: unless-stopped

    volumes:
      - ${LLAMA_MODEL}:/models/vision.gguf:ro
      - ${LLAMA_MMPROJ}:/models/mmproj.gguf:ro
      - ${PHOTO_LIBRARY_PATH:-/volume1/photo}:/photos:ro

    ports:
      # 仅用于 NAS 本机 SSH 调试。生产环境可以删掉。
      - "127.0.0.1:${LLAMA_HOST_PORT:-18082}:8082"

    command: >
      -m /models/vision.gguf
      --mmproj /models/mmproj.gguf
      --alias ${LLAMA_MODEL_ALIAS}
      --host 0.0.0.0
      --port 8082
      -c ${LLAMA_CTX:-2048}
      --cache-ram ${LLAMA_CACHE_RAM:-0}
      --threads ${LLAMA_THREADS:-4}
      --parallel 1
      --media-path /photos
      -ngl 0
      -lv ${LLAMA_LOG_VERBOSITY:-1}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  llama-embed:
    image: ai-photo-lib-llama:ds916-cpu
    container_name: ai-photo-llama-embed
    restart: unless-stopped

    volumes:
      - ${EMBED_MODEL:-/dev/null}:/model/embed.gguf:ro

    ports:
      - "127.0.0.1:${EMBED_HOST_PORT:-18083}:8083"

    command: >
      -m /model/embed.gguf
      --host 0.0.0.0
      --port 8083
      --embedding
      --pooling last
      -c ${EMBED_CTX:-8192}
      -ub ${EMBED_UB:-8192}
      -lv ${EMBED_LOG_VERBOSITY:-1}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    image: ai-photo-lib-api:ds916
    container_name: ai-photo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://photo:${POSTGRES_PASSWORD:-photo}@postgres:5432/photo
      PHOTO_LIBRARY_PATH: /photos
      HOST_PHOTO_LIBRARY_PATH: ${PHOTO_LIBRARY_PATH:-/volume1/photo}
      THUMBNAIL_PATH: /data/thumbs
      THUMBNAIL_SIZE: ${THUMBNAIL_SIZE:-512}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local}
      OPENAI_BASE_URL: http://llama:8082/v1
      OPENAI_MODEL: ${OPENAI_MODEL:-MiniCPM-V-4.6}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-MiniCPM-V-4.6}

      EMBEDDING_BASE_URL: http://llama-embed:8083/v1
      EMBEDDING_API_KEY: ${OPENAI_API_KEY:-sk-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen3-Embedding-0.6B}

      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}

    volumes:
      - ${PHOTO_LIBRARY_PATH:-/volume1/photo}:/photos:ro
      - ${DATA_DIR:-/volume1/docker/ai-photo-lib}/thumbs:/data/thumbs

    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
      llama-embed:
        condition: service_healthy

  web:
    image: ai-photo-lib-web:ds916
    container_name: ai-photo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-18088}:80"
    depends_on:
      - api

  worker:
    image: ai-photo-lib-worker:ds916
    container_name: ai-photo-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://photo:${POSTGRES_PASSWORD:-photo}@postgres:5432/photo

      PHOTO_LIBRARY_PATH: /photos
      THUMBNAIL_PATH: /data/thumbs

      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local}
      OPENAI_BASE_URL: http://llama:8082/v1
      OPENAI_MODEL: ${OPENAI_MODEL:-MiniCPM-V-4.6}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-MiniCPM-V-4.6}

      EMBEDDING_BASE_URL: http://llama-embed:8083/v1
      EMBEDDING_API_KEY: ${OPENAI_API_KEY:-sk-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen3-Embedding-0.6B}

      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}

    volumes:
      - ${PHOTO_LIBRARY_PATH:-/volume1/photo}:/photos:ro
      - ${DATA_DIR:-/volume1/docker/ai-photo-lib}/thumbs:/data/thumbs

    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
      llama-embed:
        condition: service_healthy